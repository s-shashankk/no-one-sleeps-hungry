spring:
  application:
    name: mealup
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # the schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  servlet:
    session:
      timeout: 8h
      tracking-modes: cookie
      cookie:
        name: MEALUP_SESSION
        http-only: true
        same-site: lax
        secure: false             # production sets this to true (application-prod.yml)
  error:
    include-message: never
    include-stacktrace: never
