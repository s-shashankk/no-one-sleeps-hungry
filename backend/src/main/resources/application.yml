spring:
  application:
    name: no-one-sleeps-hungry
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nosleepshungry?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Shashukushi@007}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    visibility:       # entities are returned as-is by admin endpoints: serialize their fields
      field: any
      getter: none
      is-getter: none

server:
  port: ${PORT:8080}

app:
  # comma-separated list of allowed frontend origins
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
  jwt:
    # CHANGE in production (at least 32 characters)
    secret: ${JWT_SECRET:dev-only-secret-please-change-me-0123456789}
    hours: ${JWT_HOURS:12}
  admin:
    # Super Admin created on first start if no users exist. CHANGE the password.
    name: ${ADMIN_NAME:Super Admin}
    email: ${ADMIN_EMAIL:admin@nosleepshungry.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
