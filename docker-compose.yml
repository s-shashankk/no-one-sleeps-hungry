# Optional: run MySQL without installing it.  Usage:  docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: nosleepshungry-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nosleepshungry
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
